# https://fluxcd.io/flux/components/helm/helmreleases/
# MongoDB for gathio. Same directory, same namespace, so the Service is
# mongodb.gathio.svc.cluster.local:27017.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mongodb
spec:
  interval: 10m
  # Longhorn attach on this cluster can take ~10m (FailedAttachVolume "volume is
  # not ready for workloads" retries), far past Helm's 5m default, which stalled
  # the first install even though the StatefulSet came up healthy.
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: mongodb-values
    - kind: Secret
      name: mongodb-secrets
  chart:
    spec:
      chart: mongodb
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: groundhog2k
