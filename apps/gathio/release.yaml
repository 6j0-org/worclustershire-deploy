# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gathio
spec:
  # Both releases are in one Flux Kustomization now, so ordering is a
  # HelmRelease-level dependsOn rather than a Kustomization-level one.
  dependsOn:
    - name: mongodb
  interval: 10m
  # Also a StatefulSet on Longhorn, so it needs the same headroom as mongodb.
  timeout: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: gathio-values
    - kind: Secret
      name: gathio-secrets
  chartRef:
    kind: OCIRepository
    name: devopscoop-app
