# dyff between <(yq . <(helm show values oci://ghcr.io/immich-app/immich-charts/immich --version 0.13.1)) <(yq eval '. * load("values.yaml")' <(helm show values oci://ghcr.io/immich-app/immich-charts/immich --version 0.13.1))
# vim -O <(helm show values oci://ghcr.io/immich-app/immich-charts/immich --version 0.13.1) values.yaml
controllers:
  main:
    strategy: Recreate
    containers:
      main:
        image:
          # Chart devs rejected my PR to bump image tag. They think a default install of the chart should install and outdated version of the app. I disagree. Oh well. Here we are...
          tag: v3.1.0
        env:
          DB_HOSTNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: host
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: user
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: dbname
immich:
  metrics:
    enabled: true
  persistence:
    # Main data store for all photos shared between different components.
    library:
      # Automatically creating the library volume is not supported by this chart
      # You have to specify an existing PVC to use
      existingClaim: immich-library-pvc
  # configuration is immich-config.json converted to yaml
  # ref: https://immich.app/docs/install/config-file/
  #
  configuration:
    # trash:
    #   enabled: false
    #   days: 30
    storageTemplate:
      enabled: true
      template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"
    # Nightly integrity checks. Defaults are all "0 03 * * *" (EVERY_DAY_AT_3AM),
    # but the container is Etc/UTC with TZ unset, so 03:00 UTC lands at 8PM Pacific.
    # Cron here is evaluated in UTC: 14:00 UTC == 07:00 PDT (06:00 PST in winter).
    integrityChecks:
      # Metadata-only (stat + directory walk); ~1s to queue. Cheap, keep daily.
      missingFiles:
        enabled: true
        cronExpression: "0 14 * * *"
      untrackedFiles:
        enabled: true
        cronExpression: "0 14 * * *"
      # Re-reads every asset byte to verify checksums: 100-250 GiB per run off
      # immich-library-pvc, ~2/3 of it crossing the LAN from remote replicas.
      # Weekly (Sundays) instead of daily. Longhorn's snapshotDataIntegrity plus
      # 3 replicas already cover bit rot underneath this.
      checksumFiles:
        enabled: true
        cronExpression: "0 14 * * 0"
valkey:
  enabled: true
server:
  enabled: true
machine-learning:
  persistence:
    cache:
      # Optional: Set this to persistentVolumeClaim to avoid downloading the ML models every start.
      # As of chart 0.13.0 the schema requires size/accessMode to be set explicitly here.
      type: persistentVolumeClaim
      size: 10Gi
      accessMode: ReadWriteMany


