# dyff between <(yq . <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1)) <(yq eval '. * load("values.yaml")' <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1))
# vim -O <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1) values.yaml

# 6j0.org identity (id.6j0.org): one anonymous passkey identity for every
# 6j0.org app, plus a separate encryption key per app. Apps redirect here to
# sign in and verify its tokens against /.well-known/jwks.json.
#
# Everything (identities, passkey public keys, wrapped root secrets, sessions)
# is one SQLite database in /data, and the Ed25519 token signing key is
# generated into /data on first start, so this is a StatefulSet with a PVC.
# Losing the PVC loses every identity, and with it every app's encrypted data:
# back it up. Never run more than one replica: SQLite is single-writer, and
# passkey challenges live in process memory.
workloadType: "StatefulSet"
statefulSet:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
replicaCount: 1
# Built from the Dockerfile in the id repo. "latest" only until the first
# dev-<sha>-<time> tag is published; image automation then takes over.
image:
  repository: registry.gitlab.com/6j0-org/id
  tag: "dev-71516b27-1795390234" # {"$imagepolicy": "flux-system:id:tag"}
# The image runs as `node` (1000) and writes only to /data. fsGroup makes the
# Longhorn PVC writable.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
# PORT and DB_PATH are set in the image.
service:
  port: 4000
envConfigMap:
  # Passkeys are bound to this origin (RP ID id.6j0.org, deliberately not
  # 6j0.org), and https turns on Secure cookies. Changing the hostname orphans
  # every identity.
  ORIGIN: "https://id.6j0.org"
  # Apps allowed to sign in, as name=origin. The name is the token audience
  # and part of the app's key derivation: never rename or reuse one, or that
  # app's data becomes unreadable. Each app sets ID_APP to its name here.
  APPS: "bored=https://bored.6j0.org,glaze-journal=https://glaze.6j0.org,shopping-list=https://shopping-list.6j0.org"
httpRoute:
  enabled: true
  parentRefs:
  - name: eg-public
    namespace: envoy-gateway-system
  hostnames:
  - id.6j0.org
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
volumeMounts:
- name: data
  mountPath: /data
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
