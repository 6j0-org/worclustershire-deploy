# dyff between <(yq . <(helm show values longhorn/longhorn --version 1.13.0)) <(yq eval '. * load("values.yaml")' <(helm show values longhorn/longhorn --version 1.13.0))
# vim -O <(helm show values longhorn/longhorn --version 1.13.0) values.yaml

networkPolicies:
  # Since 1.12.1 the chart installs ingress NetworkPolicies for Longhorn's
  # internal endpoints by default (restrictInternalTraffic: true), and the
  # longhorn-manager one admits only Longhorn's own pods on :9500. On a CNI
  # that enforces NetworkPolicy (kube-router on k0s, Calico, Cilium) that
  # cuts off apps/longhorn/vm.yaml's scrape, so let this stack's vmagent
  # (apps/victoria-metrics) through. One peer with both selectors: :9500 is
  # also the manager's REST API, so don't widen it to the whole namespace.
  metricsScrapeSources:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: victoria-metrics
      podSelector:
        matchLabels:
          app.kubernetes.io/name: vmagent

persistence:
  # Setting this to false, because we want to use the longhorn-crypto-global encrypted storageclass as the default.
  defaultClass: false
  # It makes me nervous to automatically delete data...
  reclaimPolicy: Retain
defaultSettings:
  # https://longhorn.io/docs/1.10.1/best-practices/#replica-auto-balance
  replicaAutoBalance: least-effort
  # https://longhorn.io/docs/1.10.1/best-practices/#allow-volumes-creation-with-degraded-availability
  allowVolumeCreationWithDegradedAvailability: false

  # Prevent bit rot
  snapshotDataIntegrity: enabled
  # Weekly snapshot hashing, Saturdays 20:00 UTC (12:00 PST / 13:00 PDT), 4 hours after
  # the daily backup (longhorn-recurring-backup.yaml) so its snapshot cleanup has
  # finished. Besides bit-rot checks, checksums let fast replica rebuild skip
  # unchanged snapshots: a node restart rebuilds the immich library in seconds
  # instead of ~1 hour, until the next day's backup merges the snapshot away.
  # Hashing takes 1-2 hours per node. Chart default: "0 0 */7 * *".
  snapshotDataIntegrityCronjob:
    v1: "0 20 * * 6"
    v2: "0 20 * * 6"

defaultBackupStore:
  # https://longhorn.io/docs/1.10.1/snapshots-and-backups/backup-and-restore/set-backup-target/#enable-virtual-hosted-style-access-for-s3-compatible-backupstore
  backupTarget: "s3://worclustershire-backup@us-west-1/"
  backupTargetCredentialSecret: wasabisys.com

# Ingress disabled - using Envoy Gateway HTTPRoute (see longhorn-httproute.yaml).
# Basic auth via EG SecurityPolicy (see longhorn-auth-policy.yaml).
ingress:
  enabled: false
