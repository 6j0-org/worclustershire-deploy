# PRIVATE Gateway: supporting/ops services (grafana, prometheus, alertmanager,
# and the like) live here so they never ride an internet-facing LB. It stays
# private via the GatewayClass default EnvoyProxy (eg-private) — unlike
# eg-public (gateway-public.yaml), nothing should ever attach the eg-public
# EnvoyProxy to this Gateway. Like the starting public Gateway it ships with
# just the http listener; add HTTPS listeners per cluster (hostname + TLS,
# typically issued by cert-manager) and restrict allowedRoutes to suit.
#
# The port-80 listener also answers the LB health check via
# httproute-healthz-private.yaml (see the healthcheck notes in envoyproxy-private.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # NOTE: no cert-manager.io/cluster-issuer annotation here, unlike eg-public.
  # This Gateway's certificate is the explicit wildcard in
  # certificate-wildcard.yaml. The annotation drives cert-manager's
  # gateway-shim, which creates one Certificate per HTTPS listener named after
  # its certificateRefs Secret -- with the annotation still present, the shim
  # and that explicit Certificate would both manage wildcard-6j0-org-tls.
  #
  # Certificates for this Gateway must use DNS-01: every hostname here
  # resolves to the MetalLB RFC1918 address below, and Let's Encrypt rejects
  # HTTP-01 for those ("no valid A records found"). That is what silently
  # expired the old per-host certs.
  name: eg-private
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # One wildcard HTTPS listener for every ops hostname on this Gateway,
    # replacing the per-hostname listener + Certificate pair that each new
    # service used to need. Adding a service here is now just an HTTPRoute.
    #
    # *.6j0.org matches exactly one label, which covers every hostname routed
    # to this Gateway today (grafana, longhorn, prometheus, alertmanager). A
    # deeper name such as foo.bar.6j0.org would need its own listener and its
    # own certificate.
    - name: https
      hostname: "*.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All
