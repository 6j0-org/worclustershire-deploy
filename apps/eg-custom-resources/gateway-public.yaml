# Minimal starting Gateway: a single HTTP listener open to HTTPRoutes in any
# namespace. This is intentionally generic — add HTTPS listeners per cluster
# (hostname + TLS, typically issued by cert-manager) and restrict allowedRoutes
# to suit. See https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/
#
# Despite the name, this Gateway starts PRIVATE: it sits on the GatewayClass
# default EnvoyProxy (eg-private) until you attach the eg-public EnvoyProxy
# stub via spec.infrastructure.parametersRef (snippet in envoyproxy-public.yaml).
# The name says what it is FOR — the listeners you expose to users — so
# flipping the scheme later is a two-line parametersRef, not a rename (a
# Gateway rename is delete+create: new fleet, new LB, DNS cutover).
#
# Supporting/ops services (monitoring UIs and the like) live on the
# always-private eg-private Gateway (gateway-private.yaml) instead, so they
# never ride an internet-facing LB. Route customer-facing apps here, ops
# tooling there.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  # NOTE: no cert-manager.io/cluster-issuer annotation. It used to drive
  # cert-manager's gateway-shim, which creates one Certificate per HTTPS
  # listener named after its certificateRefs Secret -- eleven of them here.
  # This Gateway now uses the single explicit wildcard Certificate in
  # certificate-wildcard.yaml, and with the annotation still present the shim
  # and that Certificate would both try to manage wildcard-6j0-org-tls.
  #
  # Removing it also garbage-collects the eleven old per-hostname Certificates,
  # which were owned by this Gateway. Their *-tls Secrets linger but are unused.
  name: eg-public
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # `Same` restricts this listener to routes in envoy-gateway-system:
      # tls-redirect.yaml, the healthz route, and the ACME HTTP-01 solver
      # routes cert-manager creates here. App routes live in their own
      # namespaces, so they cannot attach and their cleartext traffic falls
      # through to the catch-all redirect instead of being served on :80.
      # Widening this to `All` silently disables the HTTP->HTTPS redirect for
      # every app (a hostname-specific route outranks the catch-all).
      allowedRoutes:
        namespaces:
          from: Same

    # A TCP listener is bound to one app in a way an HTTP listener is not: a TCP
    # stream carries no hostname, so TCPRoute has no `hostnames` field and
    # routing is by port alone. Whichever TCPRoute attaches here gets the whole
    # port. Hence the app-specific name — remove this listener along with the
    # app, and give the next TCP service its own port and listener.
    #
    # Envoy passes this through at L4: Radicle speaks its own encrypted,
    # peer-authenticated protocol (apps/radicle/tcproute.yaml), so there is
    # nothing here to terminate or inspect.
    #
    # On EKS this adds a target group on 8776. The health check is unaffected —
    # the annotations in envoyproxy-public.yaml point every target group at the
    # dedicated :10080 /healthz listener, which Envoy serves regardless of which
    # port the traffic arrived on.
    - name: radicle
      protocol: TCP
      port: 8776
      allowedRoutes:
        namespaces:
          from: All


    # ONE wildcard HTTPS listener, replacing the eleven per-hostname listeners
    # that used to be here: immich, radicale, copyparty, seafile, nextcloud,
    # timetracker, peertube, hatsmith, radicle, wiki, gathio. All eleven were
    # byte-identical apart from hostname and cert name, and every one is a
    # single label, so *.6j0.org covers the lot. Adding a public app is now
    # just an HTTPRoute.
    #
    # The point is not brevity. Under DNS-01 each of those hostnames would have
    # needed its own acme-dns registration and its own _acme-challenge CNAME at
    # renewal, because acme-dns keys accounts by validated domain -- eleven
    # registrations to create and keep straight. A wildcard is validated at its
    # base domain, so this needs exactly one, keyed "6j0.org".
    #
    # *.6j0.org matches exactly one label: not the apex (see below), and not
    # deeper names like s3.garage.6j0.org.
    - name: https
      hostname: "*.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # radicle.6j0.org is served here for git-over-HTTPS (the radicle-httpd
    # sidecar in apps/radicle), while peers dial the `radicle` TCP listener
    # above on 8776 for the p2p protocol. One name, two protocols; the DNS
    # record already exists because the TCPRoute's external-dns annotation
    # created it.

    # Apex 6j0.org is NOT covered by *.6j0.org. Add a listener if/when needed.
    # - name: apex-6j0-org
    #   hostname: 6j0.org
    #   ...

    # Garage's three listeners are commented out rather than repointed, because
    # the wildcard cannot reach them: s3.garage.6j0.org is two labels deep, and
    # *.s3.garage.6j0.org / *.web.garage.6j0.org are wildcards in their own
    # right. Each would need a separate acme-dns registration and CNAME.
    #
    # garage is not deployed -- it is commented out of
    # flux/flux-system/kustomization.yaml -- and all three listeners had zero
    # attached routes. The two wildcard certs had also never issued at all,
    # pending 41 days, because HTTP-01 cannot issue wildcards. Left in place
    # with no registration they would now hold CertManagerCertNotReady
    # (apps/kube-prometheus-stack/cert-expiry-rules.yaml) permanently firing.
    #
    # To bring garage back: uncomment these, add a Certificate per hostname
    # beside certificate-wildcard.yaml, and register each validated domain --
    # apps/acme-dns/README.md, "Adding a certificate later".
    # - name: s3-garage-6j0-org
    #   hostname: "s3.garage.6j0.org"
    #   protocol: HTTPS
    #   port: 443
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - kind: Secret
    #         name: eg-s3-garage-6j0-org-tls
    #   allowedRoutes:
    #     namespaces:
    #       from: All
    #
    # - name: wildcard-s3-garage-6j0-org
    #   hostname: "*.s3.garage.6j0.org"
    #   protocol: HTTPS
    #   port: 443
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - kind: Secret
    #         name: eg-wildcard-s3-garage-6j0-org-tls
    #   allowedRoutes:
    #     namespaces:
    #       from: All
    #
    # - name: wildcard-web-garage-6j0-org
    #   hostname: "*.web.garage.6j0.org"
    #   protocol: HTTPS
    #   port: 443
    #   tls:
    #     mode: Terminate
    #     certificateRefs:
    #       - kind: Secret
    #         name: eg-wildcard-web-garage-6j0-org-tls
    #   allowedRoutes:
    #     namespaces:
    #       from: All
