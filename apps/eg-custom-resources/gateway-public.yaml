# Minimal starting Gateway: a single HTTP listener open to HTTPRoutes in any
# namespace. This is intentionally generic — add HTTPS listeners per cluster
# (hostname + TLS, typically issued by cert-manager) and restrict allowedRoutes
# to suit. See https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/
#
# Despite the name, this Gateway starts PRIVATE: it sits on the GatewayClass
# default EnvoyProxy (eg-private) until you attach the eg-public EnvoyProxy
# stub via spec.infrastructure.parametersRef (snippet in envoyproxy-public.yaml).
# The name says what it is FOR — the listeners you expose to users — so
# flipping the scheme later is a two-line parametersRef, not a rename (a
# Gateway rename is delete+create: new fleet, new LB, DNS cutover).
#
# Supporting/ops services (monitoring UIs and the like) live on the
# always-private eg-private Gateway (gateway-private.yaml) instead, so they
# never ride an internet-facing LB. Route customer-facing apps here, ops
# tooling there.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  annotations:
    # cert-manager's gateway-shim watches this annotation and creates one
    # Certificate per HTTPS listener below, named after its certificateRefs
    # Secret. Without it no Certificate exists and nothing renews the
    # *-tls Secrets -- they just expire.
    cert-manager.io/cluster-issuer: letsencrypt
  name: eg-public
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # `Same` restricts this listener to routes in envoy-gateway-system:
      # tls-redirect.yaml, the healthz route, and the ACME HTTP-01 solver
      # routes cert-manager creates here. App routes live in their own
      # namespaces, so they cannot attach and their cleartext traffic falls
      # through to the catch-all redirect instead of being served on :80.
      # Widening this to `All` silently disables the HTTP->HTTPS redirect for
      # every app (a hostname-specific route outranks the catch-all).
      allowedRoutes:
        namespaces:
          from: Same

    # A TCP listener is bound to one app in a way an HTTP listener is not: a TCP
    # stream carries no hostname, so TCPRoute has no `hostnames` field and
    # routing is by port alone. Whichever TCPRoute attaches here gets the whole
    # port. Hence the app-specific name — remove this listener along with the
    # app, and give the next TCP service its own port and listener.
    #
    # Envoy passes this through at L4: Radicle speaks its own encrypted,
    # peer-authenticated protocol (apps/radicle/tcproute.yaml), so there is
    # nothing here to terminate or inspect.
    #
    # On EKS this adds a target group on 8776. The health check is unaffected —
    # the annotations in envoyproxy-public.yaml point every target group at the
    # dedicated :10080 /healthz listener, which Envoy serves regardless of which
    # port the traffic arrived on.
    - name: radicle
      protocol: TCP
      port: 8776
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for immich.6j0.org
    - name: immich-6j0-org
      hostname: "immich.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: immich-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for radicale.6j0.org (individual cert via HTTP01)
    - name: radicale-6j0-org
      hostname: "radicale.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: radicale-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for copyparty.6j0.org
    - name: copyparty-6j0-org
      hostname: "copyparty.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: copyparty-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listeners for garage subdomains
    - name: s3-garage-6j0-org
      hostname: "s3.garage.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-s3-garage-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    - name: wildcard-s3-garage-6j0-org
      hostname: "*.s3.garage.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-wildcard-s3-garage-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    - name: wildcard-web-garage-6j0-org
      hostname: "*.web.garage.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: eg-wildcard-web-garage-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # Apex 6j0.org is NOT covered by *.6j0.org. Add a listener if/when needed.
    # - name: apex-6j0-org
    #   hostname: 6j0.org
    #   ...

    # HTTPS listener for seafile.6j0.org (individual cert via HTTP01)
    - name: seafile-6j0-org
      hostname: "seafile.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: seafile-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for nextcloud.6j0.org (individual cert via HTTP01)
    - name: nextcloud-6j0-org
      hostname: "nextcloud.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: nextcloud-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for timetracker.6j0.org
    - name: timetracker-6j0-org
      hostname: "timetracker.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: timetracker-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for peertube.6j0.org
    - name: peertube-6j0-org
      hostname: "peertube.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: peertube-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for hatsmith.6j0.org
    - name: hatsmith-6j0-org
      hostname: "hatsmith.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hatsmith-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All

    # HTTPS listener for radicle.6j0.org -- git-over-HTTPS from the
    # radicle-httpd sidecar in apps/radicle. Same hostname as the `radicle` TCP
    # listener above: peers dial it on 8776 for the p2p protocol, git clients
    # hit 443 for `git clone https://radicle.6j0.org/<repo>.git`. One name, two
    # protocols, and the DNS record already exists because the TCPRoute's
    # external-dns annotation created it.
    - name: radicle-6j0-org
      hostname: "radicle.6j0.org"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: radicle-6j0-org-tls
      allowedRoutes:
        namespaces:
          from: All
