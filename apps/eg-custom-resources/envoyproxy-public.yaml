# eg-public EnvoyProxy — the internet-facing counterpart to eg-private
# (envoyproxy-private.yaml). It is a STUB: defined and HA-ready, but the
# starting eg-public Gateway (gateway-public.yaml) deliberately does NOT
# reference it, so a fresh cluster comes up private-only. When ready to expose
# it, attach this stub in gateway-public.yaml:
#   spec:
#     infrastructure:
#       parametersRef:
#         group: gateway.envoyproxy.io
#         kind: EnvoyProxy
#         name: eg-public
#
# The HA config (replicas + topology spread + PDB) and the health-check
# annotations are identical to eg-private — see the rationale in
# envoyproxy-private.yaml. The only difference is the load-balancer scheme:
# internet-facing (the eks block below).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-public
spec:
  # IPv4 for the same reason as eg-private -- see envoyproxy-private.yaml.
  ipFamily: IPv4
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # EG v1.9.2's built-in Envoy is still v1.39.1, which has CVE-2026-35189
        # and GHSA-8vc2-jrm4-835w / GHSA-47vj-9r25-wv5j; the release notes say to
        # override it to >= v1.39.3. Setting it here is the only override that
        # takes effect, because an attached EnvoyProxy without mergeType replaces
        # the Helm-generated default. Drop this once EG's default catches up.
        container:
          image: docker.io/envoyproxy/envoy:distroless-v1.39.4
        replicas: 3
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
      envoyPDB:
        maxUnavailable: 1
