# eg-public EnvoyProxy — the internet-facing counterpart to eg-private
# (envoyproxy-private.yaml). It is a STUB: defined and HA-ready, but the
# starting eg-public Gateway (gateway-public.yaml) deliberately does NOT
# reference it, so a fresh cluster comes up private-only. When ready to expose
# it, attach this stub in gateway-public.yaml:
#   spec:
#     infrastructure:
#       parametersRef:
#         group: gateway.envoyproxy.io
#         kind: EnvoyProxy
#         name: eg-public
#
# The HA config (replicas + topology spread + PDB) and the health-check
# annotations are identical to eg-private — see the rationale in
# envoyproxy-private.yaml. The only difference is the load-balancer scheme:
# internet-facing (the eks block below).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: eg-public
spec:
  # IPv4 for the same reason as eg-private -- see envoyproxy-private.yaml.
  ipFamily: IPv4
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 3
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: topology.kubernetes.io/zone
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              matchLabelKeys:
                - gateway.envoyproxy.io/owning-gateway-name
              labelSelector:
                matchLabels:
                  app.kubernetes.io/managed-by: envoy-gateway
                  app.kubernetes.io/name: envoy
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        annotations:
          # Pin the LB address. MetalLB otherwise hands out the next free
          # address from first-pool, which is NOT the address the router
          # port-forwards to -- so a Service recreate silently moves the
          # ingress and everything stops answering. 192.168.8.11 is the IPv4
          # the pre-split `eg` Gateway held (.12 is nextcloud-aio-apache).
          #
          # Deliberately IPv4 only. The pool's IPv6 half is a globally
          # routable ISP-delegated range; pinning an address out of it would
          # break assignment for the WHOLE Service -- IPv4 included, the
          # annotation is all-or-nothing -- the day that delegation rotates.
          metallb.io/loadBalancerIPs: 192.168.8.11
