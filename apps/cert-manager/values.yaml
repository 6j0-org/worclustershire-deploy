# dyff between <(yq . <(helm show values oci://quay.io/jetstack/charts/cert-manager --version v1.21.2)) <(yq eval '. * load("values.yaml")' <(helm show values oci://quay.io/jetstack/charts/cert-manager --version v1.21.2))
# vim -O <(helm show values oci://quay.io/jetstack/charts/cert-manager --version v1.21.2) values.yaml
crds:
  enabled: true

# https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/#deploying-cert-manager
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  enableGatewayAPI: true
resources:
  requests:
    cpu: 10m
    memory: 100Mi
  limits:
    memory: 100Mi
webhook:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi
cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
    limits:
      memory: 100Mi

# IRSA — only needed when the ClusterIssuer uses the Route53 dns01 solver (see
# apps/cert-manager-custom-resources/clusterissuer.yaml). Annotate the
# cert-manager ServiceAccount with the IAM role ARN output by aws-eks-template
# (cert_manager_role_arn). Leave this off for the http01 or Cloudflare solvers.
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
# serviceAccount:
#   annotations:
#     eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/cert-manager"
# <<< eks

# Expose cert-manager's metrics to Prometheus. The controller already serves
# them on :9402, but the chart ships no ServiceMonitor, so nothing was scraping
# it -- which is why longhorn-6j0-org-tls could fail renewal 29 times over a
# month unnoticed. The `release` label is what this cluster's Prometheus
# selects on (spec.ruleSelector / serviceMonitorSelector both match
# release=kube-prometheus-stack); without it the ServiceMonitor is ignored.
# Alerts that consume these metrics live in
# apps/kube-prometheus-stack/cert-expiry-rules.yaml.
prometheus:
  servicemonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
