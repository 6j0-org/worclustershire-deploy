# https://fluxcd.io/flux/components/helm/helmreleases/
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: eg
spec:
  interval: 10m
  # Helm never upgrades CRDs shipped in a chart's crds/ directory, and Flux
  # defaults upgrade.crds to Skip, so without this the CRDs stay at whatever
  # version was first installed while the controller moves on.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: eg-values
    - kind: Secret
      name: eg-secrets
  chartRef:
    kind: OCIRepository
    name: eg-gateway-helm
