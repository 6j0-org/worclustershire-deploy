apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Setting namespace here will ensure that all objects managed by this Kustomization will explicitly be deployed to this namespace. You don't need to put specify `namespace:` anywhere else if you do this.
namespace: cert-manager

resources:
  # - cloudflare-apikey-secret.secrets.yaml
  # - porkbun-secret.secrets.yaml
  - clusterissuer.yaml

  # Uncomment once you have filled in acme-dns-account.secrets.yaml.decrypted
  # and run ./encrypt_secrets.sh. Until then the file does not exist and
  # listing it here makes this whole Kustomization fail to build.
  # - acme-dns-account.secrets.yaml
