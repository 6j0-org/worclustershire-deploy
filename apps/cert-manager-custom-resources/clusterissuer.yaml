# https://cert-manager.io/docs/configuration/acme/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: hostmaster@devops.coop

    # Default profile is "classic", but cert-manager docs uses tlsserver, which reflects "the latest recommendations from the CA/Browser Forum Baseline Requirements, as well as general trends within the WebPKI community."
    # https://cert-manager.io/docs/configuration/acme/#acme-certificate-profiles
    # https://letsencrypt.org/docs/profiles/#tlsserver
    profile: tlsserver

    # Let's Encrypt's prod server
    # https://letsencrypt.org/getting-started/#selecting-and-operating-an-acme-client-yourself
    server: https://acme-v02.api.letsencrypt.org/directory

    # This is supposed to have a default of "tls.key", but apparently that doesn't work, because I get this error when I don't specify it:
    #
    # $ k get ks -n flux-system cert-manager-custom-resources
    # NAME                            AGE   READY   STATUS
    # cert-manager-custom-resources   64m   False   ClusterIssuer/cert-manager/letsencrypt dry-run failed (Invalid): ClusterIssuer.cert-manager.io "letsencrypt" is invalid: spec.acme.privateKeySecretRef: Required value...
    #
    # https://github.com/cert-manager/cert-manager/issues/7845
    privateKeySecretRef:
      name: tls.key

    solvers:

      # Use this for envoy gateway
      # https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/#using-the-acme-issuer-with-lets-encrypt-and-http-01
      # - http01:
      #     gatewayHTTPRoute:
      #       parentRefs:
      #       - kind: Gateway
      #         name: eg-public
      #         namespace: envoy-gateway-system

      # Gateway HTTP01 solver. This is the default: no selector, so it matches
      # anything the dns01 solver below does not.
      # https://cert-manager.io/docs/usage/gateway/#example-self-service-tls-with-listenerset-and-http-01
      - http01:
          gatewayHTTPRoute: {}

      # Porkbun DNS01, for wildcards only.
      #
      # Let's Encrypt will not validate a wildcard over HTTP01 -- the ACME
      # authorization for *.example.org comes back offering dns-01 and nothing
      # else. Without a dns01 solver cert-manager finds no match, never creates
      # a Challenge, and the Order sits `pending` forever with no events. That
      # is what happened to the two garage wildcard certs.
      #
      # 6j0.org is on Porkbun nameservers and cert-manager has no built-in
      # Porkbun solver, so this goes through a third-party webhook deployed by
      # apps/cert-manager-webhook-porkbun.
      #
      # The selector is deliberately narrow. A dnsZones selector on "6j0.org"
      # would outrank the unselected http01 solver above and quietly move every
      # certificate in the zone onto DNS01; listing the two wildcard dnsNames
      # explicitly leaves the working HTTP01 certs alone. Add a name here when
      # a new wildcard is needed.
      - dns01:
          webhook:
            groupName: cert-manager-webhook-porkbun.pabloa.dev
            solverName: porkbun
            config:
              apiKey:
                name: porkbun-secret
                key: PORKBUN_API_KEY
              secretApiKey:
                name: porkbun-secret
                key: PORKBUN_SECRET_API_KEY
        selector:
          dnsNames:
            - "*.s3.garage.6j0.org"
            - "*.web.garage.6j0.org"

      # Cloudflare
      # - dns01:
      #     cloudflare:
      #       email: hostmaster@devops.coop
      #       apiTokenSecretRef:
      #         name: cloudflare-apikey-secret
      #         key: apikey

      # Use this for AWS Route53 (DNS-01). cert-manager authenticates via IRSA:
      # set the role ARN on the cert-manager ServiceAccount (see
      # apps/cert-manager/values.yaml -> serviceAccount.annotations).
      # - dns01:
      #     route53:
      #       region: us-east-2
      #       hostedZoneID: ZXXXXXXXXXXXXX
