# https://cert-manager.io/docs/configuration/acme/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: hostmaster@devops.coop

    # Default profile is "classic", but cert-manager docs uses tlsserver, which reflects "the latest recommendations from the CA/Browser Forum Baseline Requirements, as well as general trends within the WebPKI community."
    # https://cert-manager.io/docs/configuration/acme/#acme-certificate-profiles
    # https://letsencrypt.org/docs/profiles/#tlsserver
    profile: tlsserver

    # Let's Encrypt's prod server
    # https://letsencrypt.org/getting-started/#selecting-and-operating-an-acme-client-yourself
    server: https://acme-v02.api.letsencrypt.org/directory

    # This is supposed to have a default of "tls.key", but apparently that doesn't work, because I get this error when I don't specify it:
    #
    # $ k get ks -n flux-system cert-manager-custom-resources
    # NAME                            AGE   READY   STATUS
    # cert-manager-custom-resources   64m   False   ClusterIssuer/cert-manager/letsencrypt dry-run failed (Invalid): ClusterIssuer.cert-manager.io "letsencrypt" is invalid: spec.acme.privateKeySecretRef: Required value...
    #
    # https://github.com/cert-manager/cert-manager/issues/7845
    privateKeySecretRef:
      name: tls.key

    # ONE solver, DNS-01, for every certificate in the cluster.
    #
    # HTTP-01 used to be the only solver here, and it cannot work for two
    # classes of certificate this cluster needs:
    #
    #   - Anything on the eg-private Gateway. Those hostnames resolve to a
    #     MetalLB RFC1918 address, and Let's Encrypt rejects the authorization
    #     with "no valid A records found" -- it never reaches the :80 solver.
    #   - Any wildcard. Wildcards are DNS-01 only, which is why the
    #     *.s3.garage.6j0.org and *.web.garage.6j0.org certificates had never
    #     issued at all.
    #
    # Validation is delegated with acme-dns: _acme-challenge.<domain> is a
    # static CNAME into an acme-dns server, and cert-manager writes the TXT
    # record there over acme-dns's HTTP API. The zone itself can live at any
    # DNS host -- no provider API token is involved, and the credential can
    # only ever write that one delegated label.
    #
    # Each validated domain needs its own key in the account JSON and its own
    # _acme-challenge CNAME. A wildcard is validated at its base domain, so
    # *.6j0.org needs exactly one entry, keyed "6j0.org". Prefer one wildcard
    # over many per-host certificates: acme-dns stores at most 2 TXT values per
    # credential, so 3+ per-host certificates renewing at once through one
    # credential will clobber each other's challenges.
    # https://cert-manager.io/docs/configuration/acme/dns01/acme-dns/
    solvers:

      - dns01:
          acmeDNS:
            # acme-dns runs IN this cluster (apps/acme-dns). Reached over the
            # ClusterIP on plain HTTP, which keeps the credential off the wire
            # outside the pod network and avoids a bootstrap loop -- acme-dns
            # must not need a certificate that acme-dns is required to issue.
            #
            # In-cluster was a deliberate choice, not the obvious one. The
            # objection was that acme-dns is itself a nameserver and so needs
            # inbound UDP/53 from the internet, which this residential Comcast
            # line might well block. That was measured on 2026-09-26 rather
            # than assumed: with a throwaway delegation, Google's
            # (172.253.223.214) and Cloudflare's (104.22.106.113) resolvers
            # both reached a probe in this cluster over UDP/53 through the NAT.
            # It works.
            #
            # The residual risk is not availability -- certificates renew at
            # 1/3 of remaining lifetime, so a cluster outage has ~15 days of
            # slack on these 45-day certs. It is that the NS A record points at
            # a DYNAMIC address (see apps/acme-dns/config.yaml). If it changes,
            # renewals fail silently. That is why the alerts in
            # apps/kube-prometheus-stack/cert-expiry-rules.yaml exist; without
            # them this exact failure went unnoticed for a month.
            host: http://acme-dns-api.acme-dns.svc:8080
            accountSecretRef:
              name: acme-dns-account
              key: acmedns.json

      # Gateway HTTP01 solver. Superseded by the DNS-01 solver above; kept for
      # reference. Do not re-enable it alongside DNS-01 without a `selector` on
      # one of them -- with two unselected solvers, which one runs depends on
      # selector precedence and a misroute only surfaces at renewal time.
      # https://cert-manager.io/docs/usage/gateway/#example-self-service-tls-with-listenerset-and-http-01
      # - http01:
      #     gatewayHTTPRoute: {}

      # Cloudflare
      # - dns01:
      #     cloudflare:
      #       email: hostmaster@devops.coop
      #       apiTokenSecretRef:
      #         name: cloudflare-apikey-secret
      #         key: apikey

      # Use this for AWS Route53 (DNS-01). cert-manager authenticates via IRSA:
      # set the role ARN on the cert-manager ServiceAccount (see
      # apps/cert-manager/values.yaml -> serviceAccount.annotations).
      # - dns01:
      #     route53:
      #       region: us-east-2
      #       hostedZoneID: ZXXXXXXXXXXXXX
