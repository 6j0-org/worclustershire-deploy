#
# Fill in the values below, then from the repo root run:
#
#     ./encrypt_secrets.sh
#
# which writes apps/cert-manager-custom-resources/acme-dns-account.secrets.yaml
# (SOPS-encrypted, data/stringData only) and deletes this file. Then uncomment
# the acme-dns-account.secrets.yaml line in kustomization.yaml.
#
# Register against the in-cluster acme-dns (apps/acme-dns). The API is
# ClusterIP-only, so port-forward to it:
#
#     kubectl -n acme-dns port-forward svc/acme-dns-api 8080:8080
#     curl -s -X POST http://localhost:8080/register | jq .
#
# Then publish the CNAME it implies, in whatever DNS host holds 6j0.org:
#
#     _acme-challenge.6j0.org.  CNAME  <subdomain>.auth.6j0.org.
#
# KEYS ARE VALIDATED DOMAINS, not certificate names. A wildcard is validated at
# its base domain, so the *.6j0.org certificate needs one entry keyed
# "6j0.org" -- and that is also the CNAME's owner name, above.
#
# `letsencrypt` is the cluster's only ClusterIssuer and it solves DNS-01 only,
# so EVERY certificate needs an entry here plus its matching CNAME. The per-host
# certificates still on eg-public (wiki, immich, nextcloud, ...) each need one
# at their next renewal: another key alongside "6j0.org" below, from its own
# registration, with its own _acme-challenge.wiki.6j0.org CNAME, e.g.
#
#     "wiki.6j0.org": {
#       "username": "...", "password": "...",
#       "fulldomain": "....auth.6j0.org", "subdomain": "...",
#       "allowfrom": []
#     }
#
# Pointing those listeners at wildcard-6j0-org-tls instead retires them all at
# once and is the better end state: acme-dns stores at most 2 TXT values per
# credential, so 3+ per-host certificates renewing concurrently through a
# single credential will clobber each other. Give each host its own
# registration, or use the wildcard.
#
# `allowfrom` restricts which source CIDRs may update the record. The DNS
# Service uses externalTrafficPolicy: Local so real client IPs survive, but
# cert-manager reaches the API over the ClusterIP -- so scope it to the pod
# network (10.244.0.0/16) if you set it at all. Leave it [] otherwise; a wrong
# value here fails closed at renewal time.
#
# Keep the value below valid JSON -- it is parsed, not templated. Comments
# cannot go inside the block scalar.
