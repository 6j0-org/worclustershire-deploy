# dyff between <(yq . <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1)) <(yq eval '. * load("values.yaml")' <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1))
# vim -O <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1) values.yaml

# A Radicle seed node: `radicle-node` from the Heartwood stack, replicating and
# serving repos over the Radicle p2p protocol on TCP 8776. See README.md in this
# directory for the one-time node-key bootstrap and for how to seed repos.

# The node's git storage, its databases and its control socket all live under
# RAD_HOME, which is the radicle-home PVC (radicle-home-pvc.yaml). The Node ID
# other peers dial is derived from a keypair that must not change, but that is
# mounted from a Secret rather than kept on the volume -- so nothing here needs
# the stable pod identity a StatefulSet would give it, and the chart's default
# Deployment is enough.
replicaCount: 1

# One node, one ReadWriteOnce volume: a rolling update would start the new pod
# while the old one still has that volume attached, and it would sit unschedulable
# until the rollout timed out. The old pod has to go first.
strategy:
  type: Recreate

image:
  # Radicle publishes no official container image -- upstream ships .deb
  # packages and systemd units only. This community image unpacks the signed
  # upstream radicle-x86_64-unknown-linux-musl release tarball onto Fedora, so
  # the binaries are the ones the Radicle team built. It only ever carries the
  # `latest` tag and is rebuilt whenever upstream moves, so the digest below is
  # what actually pins the version -- bump it deliberately after checking what
  # changed. Currently radicle-node 1.10.1. linux/amd64 only.
  #
  # TODO: Use an official image or file an issue to create one.
  repository: docker.io/dirk1980/radicle-seed-node
  tag: latest@sha256:78ccee526ad4b4f4d7c79c2323b032a7209858a48e1dc9c077272ff1660050e2

# radicle-node takes --config and --secret, but the `rad` CLI does not: it only
# ever reads $RAD_HOME/config.json and $RAD_HOME/keys/, and refuses to run
# ("Radicle profile not found") if either is missing. Since `rad` is how you
# administer this node -- `rad node status`, `rad seed` -- the config and key are
# layered into RAD_HOME at the paths it expects instead, and radicle-node is
# left on its defaults.
command:
  - /usr/local/bin/radicle-node
args:
  - --force # a stale node/control.sock survives an unclean shutdown on the PVC

# Which repos this node carries is a per-repo policy in node/policies.db on the
# PVC, not something config.json can express -- config.json only sets the
# default, which is "block". Left alone that would make the list of seeded repos
# invisible to git and lost with the volume, so this reconciles the database
# against seeded-repos.txt before the node starts: seeding what is listed,
# unseeding what is not. `rad` writes policies.db directly, so it works with the
# node down, and unseeding drops the policy rather than the replicated data.
initContainers:
  - name: seed-policies
    # Must match image: above -- the chart only templates that into the main
    # container, so the digest is spelled out twice and has to be bumped twice.
    image: docker.io/dirk1980/radicle-seed-node@sha256:78ccee526ad4b4f4d7c79c2323b032a7209858a48e1dc9c077272ff1660050e2
    command:
      - /bin/sh
      - -euc
      - |
        list=/etc/radicle/seeded-repos.txt
        desired=$(sed 's/#.*//' "$list" | tr -s '[:space:]' '\n' | grep '^rad:' | sort -u | tr '\n' ' ' || true)
        current=$(rad seed | grep -o 'rad:[a-zA-Z0-9]*' | sort -u | tr '\n' ' ' || true)
        for rid in $current; do
          case " $desired " in
            *" $rid "*) ;;
            *) rad unseed "$rid" ;;
          esac
        done
        if [ -n "$desired" ]; then
          rad seed --no-fetch --scope all $desired
        fi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    # `rad` needs a complete profile, so this mirrors the node's mounts, plus
    # the ConfigMap itself for the repo list.
    volumeMounts:
      - name: radicle-home
        mountPath: /radicle-home
      - name: config
        mountPath: /radicle-home/config.json
        subPath: config.json
        readOnly: true
      - name: node-key
        mountPath: /radicle-home/keys
        readOnly: true
      - name: config
        mountPath: /etc/radicle
        readOnly: true
      - name: tmp
        mountPath: /tmp

  # radicle-httpd: the HTTP gateway that makes repos clonable over git-over-
  # HTTPS, so `git clone https://radicle.6j0.org/fluxcd-template.git` works for
  # people who have no Radicle client at all. See README.md -> "Cloning over
  # HTTPS".
  #
  # It is a native sidecar -- an initContainer with restartPolicy: Always --
  # rather than its own Deployment, because it reads the node's storage and
  # databases directly rather than talking to the node over the network. That
  # storage is the radicle-home PVC, which is ReadWriteOnce and already
  # attached here; a separate Deployment would need node affinity to get at it.
  # Native sidecars need Kubernetes 1.29 (beta, on by default) or 1.33 for GA.
  #
  # The chart has no sidecars/extraContainers value, but it passes
  # initContainers through with a plain toYaml, so restartPolicy survives.
  # Being listed after seed-policies means that one still runs to completion
  # first.
  - name: radicle-httpd
    restartPolicy: Always
    # Unlike the node image, this binary is NOT from the signed upstream
    # release tarball -- that ships only rad, radicle-node and git-remote-rad.
    # radicle-httpd lives in its own repo and has to be compiled, so this is a
    # third-party build by the same publisher as the node image. Weigh that
    # before bumping, and check the digest below is one you meant to run.
    image: docker.io/dirk1980/radicle-httpd@sha256:5e95be30e4bde55b509a65fd56f8b825cafd0f5cd752c1a13e79aad75b958895
    # The alias list is built at startup from seeded-repos.txt, so the same
    # file drives what the node seeds, what the mirror CronJob pushes, and what
    # names resolve over HTTPS. An entry's second column is the name in the
    # URL; entries without one stay reachable by their rad: ID.
    #
    # The image's entrypoint bakes in --listen, so it is replaced wholesale.
    command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        aliases=()
        while read -r rid name; do
          aliases+=(--alias "$name" "$rid")
        done < <(sed 's/#.*//' /etc/radicle/seeded-repos.txt |
                 awk '$1 ~ /^rad:/ && NF >= 2 { print $1, $2 }')
        echo "radicle-httpd: ${#aliases[@]} alias arguments from seeded-repos.txt" >&2
        exec /usr/local/bin/radicle-httpd --listen '[::]:8080' \
          ${aliases[@]+"${aliases[@]}"}
    ports:
      - name: httpd
        containerPort: 8080
        protocol: TCP
    # Liveness only, deliberately no readinessProbe. Pod readiness gates the
    # Service endpoints, and those endpoints are what the *TCPRoute* uses to
    # reach the node on 8776 -- so a readiness probe here would let a sick web
    # gateway pull the seed node off the p2p network. A liveness failure
    # restarts this container alone and leaves the node serving peers.
    livenessProbe:
      httpGet:
        path: /api/v1
        port: httpd
      periodSeconds: 30
      failureThreshold: 3
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    # Mirrors the node's own mounts: radicle-httpd needs a complete profile at
    # RAD_HOME, not just the storage directory.
    volumeMounts:
      - name: radicle-home
        mountPath: /radicle-home
      - name: config
        mountPath: /radicle-home/config.json
        subPath: config.json
        readOnly: true
      # Both key files, as the node gets them. radicle-httpd is a read-only
      # view over the node's state and does not sign anything, so narrowing
      # this to radicle.pub with a `items:` selector would be worth testing --
      # profile loading may or may not insist the private key file exists.
      - name: node-key
        mountPath: /radicle-home/keys
        readOnly: true
      # For seeded-repos.txt, same as the seed-policies initContainer.
      - name: config
        mountPath: /etc/radicle
        readOnly: true
      - name: tmp
        mountPath: /tmp

volumes:
  # Under a StatefulSet the chart templates this claim for you; a Deployment
  # gets one claim for the whole workload, declared in radicle-home-pvc.yaml.
  - name: radicle-home
    persistentVolumeClaim:
      claimName: radicle-home
  - name: config
    configMap:
      name: radicle-config
  - name: node-key
    secret:
      # It's a reference, not a secret -- detect-secrets flags the keyword.
      secretName: radicle-node-key # pragma: allowlist secret
      defaultMode: 288 # 0440 -- fsGroup owns it, so it needs group read
  # readOnlyRootFilesystem, so give the process somewhere to write scratch files.
  - name: tmp
    emptyDir: {}

# The config and key mounts land *inside* the PVC's mount path, shadowing those
# two paths with read-only copies -- so the identity never touches the PVC and
# the config can't drift from git, while storage/ and the node databases still
# persist underneath.
volumeMounts:
  - name: radicle-home
    mountPath: /radicle-home # RAD_HOME, set by the image
  - name: config
    mountPath: /radicle-home/config.json
    subPath: config.json # a single file, so the rest of RAD_HOME stays visible
    readOnly: true
  - name: node-key
    mountPath: /radicle-home/keys
    readOnly: true
  - name: tmp
    mountPath: /tmp

# The image runs as root and declares no user of its own. Nothing here needs
# it: the binary is statically linked and every path it writes is mounted.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  # ClusterIP (the chart default). Peers reach this node through the eg-public
  # Gateway, which forwards TCP 8776 to this Service -- see tcproute.yaml. The
  # node does not own a LoadBalancer of its own.
  #
  # The chart derives the container port from this and names it `http`. The name
  # is a chart-ism -- what actually crosses this port is the Radicle p2p
  # protocol, not HTTP.
  port: 8776

# Radicle speaks its own protocol over TCP, so the chart's default HTTP probes
# can never succeed. `httpGet: null` deletes the chart's handler rather than
# adding a second one to it -- Helm merges these maps, and a probe with two
# handlers is rejected.
startupProbe:
  httpGet: null
  tcpSocket:
    port: http
  periodSeconds: 5
  failureThreshold: 30 # first start migrates the COB cache and refs databases
livenessProbe:
  httpGet: null
  tcpSocket:
    port: http
  periodSeconds: 30
readinessProbe:
  httpGet: null
  tcpSocket:
    port: http
  periodSeconds: 10

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi
