apiVersion: apps/v1
kind: Deployment
metadata:
  name: acme-dns
spec:
  # One replica, and Recreate rather than RollingUpdate: the SQLite database
  # lives on a ReadWriteOnce volume, so two pods cannot hold it at once and a
  # rolling update would deadlock waiting to attach.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: acme-dns
  template:
    metadata:
      labels:
        app: acme-dns
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # Makes the Longhorn volume group-writable so SQLite can create its
        # database and write-ahead files.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: acme-dns
          image: joohoi/acme-dns:v2.0.2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Kept in the bounding set even though we listen on 5353 and
              # never need it. If the binary carries cap_net_bind_service as a
              # FILE capability, dropping ALL makes exec() itself fail with
              # EPERM before main() runs -- the coredns image does exactly
              # this, and it cost us a crashloop while testing UDP/53.
              add: ["NET_BIND_SERVICE"]
          ports:
            - name: dns-udp
              containerPort: 5353
              protocol: UDP
            - name: dns-tcp
              containerPort: 5353
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
          # TCP probes rather than httpGet: acme-dns v2's API route list is not
          # documented and a wrong path would leave the pod permanently
          # unready. A successful connect proves the API listener is serving,
          # which is what cert-manager needs.
          readinessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: api
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            # acme-dns reads /etc/acme-dns/config.cfg; the image expects the
            # directory, not the file.
            - name: config
              mountPath: /etc/acme-dns
              readOnly: true
            - name: data
              mountPath: /var/lib/acme-dns
      volumes:
        - name: config
          configMap:
            name: acme-dns-config
        - name: data
          persistentVolumeClaim:
            claimName: acme-dns-data
