# dyff between <(yq . <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1)) <(yq eval '. * load("recipegen-values.yaml")' <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1))
# vim -O <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1) recipegen-values.yaml

# The shopping list's recipe generator (recipegen/ in the shopping-list repo):
# Chef Transformer, a ~200M-parameter T5 trained on RecipeNLG, on CPU-only
# PyTorch. The shopping list calls it at RECIPEGEN_URL for "Suggest meals".
# It has no sign-in of its own, so it has no HTTPRoute, and recipegen-netpol.yaml
# lets only the shopping list reach it.
#
# Stateless: the model (~850 MB) is baked into the image, pinned to a commit,
# so the pod needs no network or volume of its own. One request generates at a
# time (two more queue), so one replica is enough.
replicaCount: 1
image:
  repository: registry.gitlab.com/6j0-org/shopping-list/recipegen
  tag: "dev-bbca7aa8-1795582985" # {"$imagepolicy": "flux-system:recipegen:tag"}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
service:
  port: 8001
# The server starts listening only once the model is loaded (a few seconds,
# longer on a cold node). While it generates, one busy CPU can make /healthz
# slow to answer, so the probes wait long and fail slowly rather than restart
# a pod in the middle of a request.
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 5
  failureThreshold: 36
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 30
  timeoutSeconds: 15
  failureThreshold: 4
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 15
  timeoutSeconds: 15
  failureThreshold: 4
# Measured on one thread: three recipes in 10-30 s; more threads barely help.
envConfigMap:
  RECIPEGEN_THREADS: "1"
volumes:
- name: tmp
  emptyDir: {}
volumeMounts:
- name: tmp
  mountPath: /tmp
# Measured: ~420 MB idle, ~1.4 GB peak while generating three recipes.
resources:
  requests:
    cpu: 500m
    memory: 1536Mi
  limits:
    memory: 2Gi
