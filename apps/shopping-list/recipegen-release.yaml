# https://fluxcd.io/flux/components/helm/helmreleases/
# The recipe generator, from the same chart as the shopping list. See
# recipegen-values.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recipegen
spec:
  interval: 10m
  valuesFrom:
    - kind: ConfigMap
      name: recipegen-values
  chartRef:
    kind: OCIRepository
    name: devopscoop-app
