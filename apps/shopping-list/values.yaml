# dyff between <(yq . <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1)) <(yq eval '. * load("values.yaml")' <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1))
# vim -O <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1) values.yaml

# The app keeps everything (list, pantry, barcode and recipe caches) in one
# SQLite file at /data/shopping.db, so this is a StatefulSet with a PVC rather
# than a Deployment. SQLite is single-writer: keep replicaCount at 1.
workloadType: "StatefulSet"
statefulSet:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
replicaCount: 1
image:
  repository: registry.gitlab.com/6j0-org/shopping-list
  tag: "dev-acbccaf6-1795493880" # {"$imagepolicy": "flux-system:shopping-list:tag"}
# The image runs as uid 10001; fsGroup makes the PVC writable by it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
service:
  port: 8000
# An https ORIGIN turns on Secure cookies.
#
# People sign in with their 6j0.org identity (apps/id); there is no other
# sign-in, and the server won't start without ID_ORIGIN. ID_APP must match
# this app's name in apps/id's APPS; never rename it. The JWKS is fetched over
# the in-cluster Service rather than through the public gateway.
#
# There's one list, shared by the identities in ALLOWED_SUBS (6j0.org subs,
# comma- or space-separated). Empty means nobody can use the list; anyone who
# signs in sees their ID on the "This list is private" page, and the server
# logs it. Any signed-in identity can use Feedback; ADMIN_SUB can close and
# delete anyone's feedback (it doesn't get the list unless it's also in
# ALLOWED_SUBS). Subs aren't secrets, so they can live here.
envConfigMap:
  ORIGIN: "https://shopping-list.6j0.org"
  ID_ORIGIN: "https://id.6j0.org"
  ID_APP: "shopping-list"
  ID_JWKS_URL: "http://id.id.svc.cluster.local:4000/.well-known/jwks.json"
  # ALLOWED_SUBS: ""
  # ADMIN_SUB: ""
httpRoute:
  enabled: true
  parentRefs:
  - name: eg-public
    namespace: envoy-gateway-system
  hostnames:
  - shopping-list.6j0.org
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
# Like gathio: the PVC volume comes from the volumeClaimTemplate, so "data" is
# mounted here but not listed under volumes:. /tmp is the only other writable
# path the read-only root filesystem needs.
volumes:
- name: tmp
  emptyDir: {}
volumeMounts:
- name: data
  mountPath: /data
- name: tmp
  mountPath: /tmp
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
