# "Suggest meals" (POST /api/recipes/generate) waits on the recipe generator:
# 10-30 s per request on one CPU, more when others are queued (the app gives
# up after 150 s). That's past Envoy's default 15 s route timeout, and the
# chart's HTTPRoute can't set timeouts, so this route takes just that path,
# with a longer one. Gateway API picks the longest matching path across routes
# on the same hostname, so everything else stays on the chart's route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shopping-list-generate
spec:
  parentRefs:
    - name: eg-public
      namespace: envoy-gateway-system
  hostnames:
    - shopping-list.6j0.org
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/recipes/generate
      timeouts:
        request: "160s"
        backendRequest: "160s"
      backendRefs:
        - name: shopping-list
          port: 8000
