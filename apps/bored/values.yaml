# dyff between <(yq . <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1)) <(yq eval '. * load("values.yaml")' <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1))
# vim -O <(helm show values oci://registry.gitlab.com/devopscoop/charts/app --version 0.11.1) values.yaml

# Bored? (local event board). Everything (accounts, passkey public keys,
# posts, encrypted vaults and chats) is one SQLite database in /data
# (DB_PATH), so this is a StatefulSet with a PVC rather than a Deployment.
# Never run more than one replica: SQLite is single-writer, and passkey
# challenges live in process memory, so a second pod would break sign-in.
workloadType: "StatefulSet"
statefulSet:
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
replicaCount: 1
# Built from the Dockerfile in the bored repo. "latest" only until the first
# dev-<sha>-<time> tag is published; image automation then takes over.
image:
  repository: registry.gitlab.com/6j0-org/bored
  tag: "dev-5ddea224-1795814324" # {"$imagepolicy": "flux-system:bored:tag"}
# The image runs as `node` (1000) and writes only to /data. fsGroup makes the
# Longhorn PVC writable.
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
# PORT and DB_PATH are set in the image.
service:
  port: 3000
# An https ORIGIN turns on Secure cookies; without it the server trusts the
# Host/X-Forwarded-Proto headers.
#
# AUTH_MODE=6j0: people sign in with their 6j0.org identity (apps/id) instead
# of Bored?'s own passkeys, so one passkey covers every 6j0.org app. ID_APP
# must match this app's name in apps/id's APPS. The JWKS is fetched over the
# in-cluster Service rather than through the public gateway. Switching
# AUTH_MODE after launch strands existing accounts: the modes don't share them.
#
# TZ: the server's clock, for when "New posts in Discover" notifications go
# out (DISCOVER_NEWS_HOURS, default 10:00 and 16:00).
envConfigMap:
  TZ: "America/Los_Angeles"
  ORIGIN: "https://bored.6j0.org"
  AUTH_MODE: "6j0"
  ID_ORIGIN: "https://id.6j0.org"
  ID_APP: "bored"
  ID_JWKS_URL: "http://id.id.svc.cluster.local:4000/.well-known/jwks.json"
httpRoute:
  enabled: true
  parentRefs:
  - name: eg-public
    namespace: envoy-gateway-system
  hostnames:
  - bored.6j0.org
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
volumeMounts:
- name: data
  mountPath: /data
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi
