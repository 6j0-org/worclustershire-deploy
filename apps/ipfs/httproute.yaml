# Serves the pinned site at the root of site.6j0.org.
#
# Kubo's gateway only knows /ipfs/<CID>/... paths, so Envoy rewrites every
# request onto the site's CID. CID_FROM_SITE_ENV is a placeholder: the
# `replacements` in kustomization.yaml swap in the CID from site.env, so it
# never has to be edited here.
#
# Only this one CID is reachable. Any other /ipfs/... path falls into the
# catch-all rule and is rewritten under the site's CID, where it 404s. Kubo's
# Gateway.NoFetch is the second layer behind that.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: site
spec:
  parentRefs:
    - name: eg-public
      namespace: envoy-gateway-system
  hostnames:
    # Covered by the *.6j0.org wildcard certificate. Must match the
    # AppendAnnounce address in kubo-init.sh.
    - site.6j0.org
  rules:
    # The home page. An exact match beats the prefix rule below, and spells
    # out the trailing slash so Kubo serves index.html directly rather than
    # 301ing /ipfs/<CID> to /ipfs/<CID>/.
    - matches:
        - path:
            type: Exact
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ipfs/CID_FROM_SITE_ENV/
      backendRefs:
        - name: kubo
          port: 8080

    # Pass-through for the site's own /ipfs/<CID>/ path. Kubo builds its
    # trailing-slash redirects (and generated directory listings) from the
    # path it received, which is the rewritten one: /blog becomes a 301 to
    # /ipfs/<CID>/blog/. This rule makes that URL work instead of being
    # rewritten a second time.
    - matches:
        - path:
            type: PathPrefix
            value: /ipfs/CID_FROM_SITE_ENV
      backendRefs:
        - name: kubo
          port: 8080

    # Everything else: /about.html -> /ipfs/<CID>/about.html.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /ipfs/CID_FROM_SITE_ENV/
      backendRefs:
        - name: kubo
          port: 8080
