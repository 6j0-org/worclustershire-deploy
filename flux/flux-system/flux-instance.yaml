# https://fluxoperator.dev/get-started/
# https://fluxoperator.dev/docs/instance/customization/#cluster-sync-sops-decryption
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  annotations:
    # Never let kustomize-controller prune this object: the operator's finalizer
    # uninstalls every Flux component when the FluxInstance is deleted.
    kustomize.toolkit.fluxcd.io/prune: disabled
  name: flux
  namespace: flux-system
spec:
  distribution:
    # Exact version pin — disables the operator's automatic Flux updates.
    # Run ./update_flux-instance.sh to bump this together with the
    # digest-pinned controller images in kustomize.patches below.
    version: "2.9.4"
    registry: "ghcr.io/fluxcd"
    artifact: "oci://ghcr.io/controlplaneio-fluxcd/flux-operator-manifests"
  components:
    - source-controller
    - source-watcher
    - kustomize-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
  cluster:
    type: kubernetes
    size: medium
    multitenant: false
    networkPolicy: true
    domain: "cluster.local"
  sync:
    kind: GitRepository
    url: ssh://git@github.com/6j0-org/worclustershire-deploy
    ref: refs/heads/main
    path: flux
    pullSecret: flux-system
  kustomize:
    patches:
      - patch: |
          - op: add
            path: /spec/decryption
            value:
              provider: sops
              secretRef:
                name: sops-age
        target:
          kind: Kustomization
# >>> eks: deploy.sh uncomments this block when k8s_platform=eks
#       # IRSA annotation so the image-reflector-controller can authenticate to AWS ECR to poll image tags
#       - patch: |
#           - op: add
#             path: /metadata/annotations
#             value:
#               eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/flux-image-reflector-controller"
#         target:
#           kind: ServiceAccount
#           name: image-reflector-controller
# <<< eks
      # Pin controller images by digest (belt-and-braces on top of the exact
      # distribution.version pin above). These digests correspond to the
      # distribution.version above — run ./update_flux-instance.sh to refresh both.
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/source-controller:v1.9.4@sha256:8a8ed0a57b8b86f561d5a4309a69f65e62f0cebe4de8801593c5ff35a3bc3c23"
        target:
          kind: Deployment
          name: source-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/source-watcher:v2.2.3@sha256:40f35415a78f4514aea41cf4d6dd299d59bc646eb4a73365eac831c8ced2445a"
        target:
          kind: Deployment
          name: source-watcher
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/kustomize-controller:v1.9.4@sha256:2b8bec54ffb6caf421bd2a6c005d27f567d5dd4db7feb55794fb51fcabd69b8f"
        target:
          kind: Deployment
          name: kustomize-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/helm-controller:v1.6.3@sha256:16ada99456385100698a5d7adf90aba8a2089d987ab541c9566b6d7b0e897038"
        target:
          kind: Deployment
          name: helm-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/notification-controller:v1.9.3@sha256:071c351a0fb163eeb6a2bb82f1e894f51b6b0734216d2e97d3d99c9ab9d710b9"
        target:
          kind: Deployment
          name: notification-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/image-reflector-controller:v1.2.4@sha256:d63550296dc9a6c2b7c9246cb7ef6e52d7469d5b104cd329622301b46971e255"
        target:
          kind: Deployment
          name: image-reflector-controller
      - patch: |
          - op: replace
            path: /spec/template/spec/containers/0/image
            value: "ghcr.io/fluxcd/image-automation-controller:v1.2.4@sha256:0286cbba95a2606a006e370052cb642f4370cb42ceea8353b5cba922cf47770c"
        target:
          kind: Deployment
          name: image-automation-controller
      # Controller resource requests/limits (operator-rendered Deployments, so
      # these must be set here rather than via a kustomize patch in the repo).
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: helm-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 209Mi
                      limits:
                        memory: 209Mi
        target:
          kind: Deployment
          name: helm-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: image-automation-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 100Mi
                      limits:
                        memory: 100Mi
        target:
          kind: Deployment
          name: image-automation-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: image-reflector-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 1069Mi
                      limits:
                        memory: 1069Mi
        target:
          kind: Deployment
          name: image-reflector-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: kustomize-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 23m
                        memory: 234Mi
                      limits:
                        memory: 234Mi
        target:
          kind: Deployment
          name: kustomize-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: notification-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 100Mi
                      limits:
                        memory: 100Mi
        target:
          kind: Deployment
          name: notification-controller
      - patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: source-controller
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      requests:
                        cpu: 10m
                        memory: 328Mi
                      limits:
                        memory: 328Mi
        target:
          kind: Deployment
          name: source-controller
