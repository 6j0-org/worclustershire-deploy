apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hacky-renovate-cronjobs
  namespace: flux-system
spec:
  interval: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: apps/hacky-renovate-cronjobs
  prune: true
  # Only the CronJob's pods mount the cache PVCs. A storage class that binds a
  # volume only once a pod mounts it leaves them Pending between runs, so
  # waiting for them would time out every reconcile. A failed run pages
  # through KubeJobFailed instead (apps/hacky-renovate-cronjobs/README.md).
  wait: false
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  suspend: false
