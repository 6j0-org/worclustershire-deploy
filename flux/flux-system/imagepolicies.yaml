---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: timetracker
  namespace: flux-system
spec:
  filterTags:
    extract: $ts
    pattern: ^dev-[a-f0-9]+-(?P<ts>[0-9]+)
  imageRepositoryRef:
    name: timetracker
    namespace: flux-system
  policy:
    numerical:
      order: asc
